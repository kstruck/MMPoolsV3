# Social link-unfurl crawler detection. This directive is in the http{} context
# because Dockerfile copies this file to /etc/nginx/conf.d/default.conf, which the
# stock nginx.conf includes inside http{}. Search engines are intentionally NOT
# matched: they render the SPA, where <RouteSEO> marks these routes noindex.
map $http_user_agent $is_social_bot {
    default 0;
    "~*facebookexternalhit|Facebot|Twitterbot|Slackbot|Slack-ImgProxy|LinkedInBot|WhatsApp|Discordbot|TelegramBot|Pinterest|redditbot|vkShare|SkypeUriPreview|Embedly|nuzzel|Qwantify" 1;
}

server {
    listen 80 default_server;
    server_name _;

    # Hide Nginx version from response headers
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "DENY"                            always;
    add_header X-XSS-Protection        "1; mode=block"                   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Shareable pool routes: /pool/:id (most share links use this) and /join/:id
    # (invite links). ONLY social crawlers are proxied to the joinPreview Cloud
    # Function for per-pool Open Graph tags. Humans get the identical static SPA
    # path (try_files), so the hot pool-page load is unchanged and never depends
    # on the function — if the function/DNS is down, only crawler previews 502.
    location ~ ^/(pool|join)/ {
        error_page 418 = @social_preview;
        if ($is_social_bot) { return 418; }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Crawler-only proxy target. Uses a VARIABLE proxy_pass + resolver on purpose:
    # the hostname resolves at request time via Docker's embedded DNS (127.0.0.11),
    # so a DNS/upstream problem can only 502 this route — it can never stop nginx
    # from starting and take the whole static site down. $request_uri is the full
    # original path (/pool/<id> or /join/<id>) so the function can extract the id.
    location @social_preview {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $join_fn "us-central1-gridiron-gamble-uzuqo.cloudfunctions.net";
        proxy_pass https://$join_fn/joinPreview$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $join_fn;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Disable caching for index.html so browsers always fetch the latest bundle hashes
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}

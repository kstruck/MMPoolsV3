# Social link-unfurl crawler detection. This directive is in the http{} context
# because Dockerfile copies this file to /etc/nginx/conf.d/default.conf, which the
# stock nginx.conf includes inside http{}. Search engines are intentionally NOT
# matched: they render the SPA, where <RouteSEO> marks these routes noindex.
map $http_user_agent $is_social_bot {
    default 0;
    "~*facebookexternalhit|Facebot|Twitterbot|Slackbot|Slack-ImgProxy|LinkedInBot|WhatsApp|Discordbot|TelegramBot|Pinterest|redditbot|vkShare|SkypeUriPreview|Embedly|nuzzel|Qwantify" 1;
}

server {
    listen 80 default_server;
    server_name _;

    # Hide Nginx version from response headers
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # ── Security Headers ──────────────────────────────────────
    # NOTE: nginx add_header does NOT inherit into a location that sets its own
    # add_header, so the security set is repeated in each location below that
    # emits Cache-Control. Keep the CSP string identical across all three copies.
    # CSP mirrors firebase.json (prod serves via this nginx, not Firebase Hosting).
    # tests/csp-invariants.test.ts asserts all four copies are byte-identical and
    # that report-uri / report-to / Reporting-Endpoints agree with each other.
    #
    # X-XSS-Protection is DELIBERATELY "0". The legacy filter it enables was
    # removed from Chrome and Edge and was itself an XSS vector (its "fix" could
    # be steered to disable a safe inline script or to leak cross-origin data);
    # "0" turns it off explicitly rather than leaving the browser default. CSP is
    # the real control. Do not "restore" it to "1; mode=block".
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "DENY"                            always;
    add_header X-XSS-Protection        "0"                               always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://apis.google.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.espncdn.com https://*.espn.com https://a.espncdn.com https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebase.com https://*.firebaseapp.com https://www.google-analytics.com https://site.api.espn.com https://generativelanguage.googleapis.com wss://*.firebaseio.com https://us-central1-gridiron-gamble-uzuqo.cloudfunctions.net https://*.ingest.us.sentry.io; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; report-uri https://us-central1-gridiron-gamble-uzuqo.cloudfunctions.net/cspReport; report-to csp-endpoint;" always;
    # Names the group the CSP's `report-to csp-endpoint` refers to. WITHOUT THIS
    # HEADER the report-to directive resolves to nothing and Chrome discards every
    # violation silently. Single-quoted because the value's own quotes are part of
    # the structured-field syntax. Collector: functions/src/cspReport.ts.
    add_header Reporting-Endpoints     'csp-endpoint="https://us-central1-gridiron-gamble-uzuqo.cloudfunctions.net/cspReport"' always;

    # Shareable pool routes: /pool/:id (most share links use this) and /join/:id
    # (invite links). ONLY social crawlers are proxied to the joinPreview Cloud
    # Function for per-pool Open Graph tags. Humans get the identical static SPA
    # path (try_files), so the hot pool-page load is unchanged and never depends
    # on the function — if the function/DNS is down, only crawler previews 502.
    location ~ ^/(pool|join)/ {
        error_page 418 = @social_preview;
        if ($is_social_bot) { return 418; }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        # Re-assert security headers (add_header does not inherit into locations).
        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header X-Frame-Options         "DENY"                            always;
        add_header X-XSS-Protection        "0"                               always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://apis.google.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.espncdn.com https://*.espn.com https://a.espncdn.com https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebase.com https://*.firebaseapp.com https://www.google-analytics.com https://site.api.espn.com https://generativelanguage.googleapis.com wss://*.firebaseio.com https://us-central1-gridiron-gamble-uzuqo.cloudfunctions.net https://*.ingest.us.sentry.io; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; report-uri https://us-central1-gridiron-gamble-uzuqo.cloudfunctions.net/cspReport; report-to csp-endpoint;" always;
        add_header Reporting-Endpoints     'csp-endpoint="https://us-central1-gridiron-gamble-uzuqo.cloudfunctions.net/cspReport"' always;
    }

    # Crawler-only proxy target. Uses a VARIABLE proxy_pass + resolver on purpose:
    # the hostname resolves at request time via Docker's embedded DNS (127.0.0.11),
    # so a DNS/upstream problem can only 502 this route — it can never stop nginx
    # from starting and take the whole static site down. $request_uri is the full
    # original path (/pool/<id> or /join/<id>) so the function can extract the id.
    location @social_preview {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $join_fn "us-central1-gridiron-gamble-uzuqo.cloudfunctions.net";
        proxy_pass https://$join_fn/joinPreview$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $join_fn;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Disable caching for index.html so browsers always fetch the latest bundle hashes
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        # Re-assert security headers (add_header does not inherit into locations).
        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header X-Frame-Options         "DENY"                            always;
        add_header X-XSS-Protection        "0"                               always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://apis.google.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.espncdn.com https://*.espn.com https://a.espncdn.com https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebase.com https://*.firebaseapp.com https://www.google-analytics.com https://site.api.espn.com https://generativelanguage.googleapis.com wss://*.firebaseio.com https://us-central1-gridiron-gamble-uzuqo.cloudfunctions.net https://*.ingest.us.sentry.io; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; report-uri https://us-central1-gridiron-gamble-uzuqo.cloudfunctions.net/cspReport; report-to csp-endpoint;" always;
        add_header Reporting-Endpoints     'csp-endpoint="https://us-central1-gridiron-gamble-uzuqo.cloudfunctions.net/cspReport"' always;
    }

    # Immutable, content-hashed build assets → cache a year.
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
    }

    # Images (favicons, icons, og-image) are NOT content-hashed → 7d, matching
    # firebase.json (max-age=604800) so a swapped og-image/icon isn't pinned a year.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

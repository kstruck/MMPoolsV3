server {
    listen 80 default_server;
    server_name _;

    # Hide Nginx version from response headers
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "DENY"                            always;
    add_header X-XSS-Protection        "1; mode=block"                   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Social link-unfurl previews for /join/:poolId — proxy to the joinPreview
    # Cloud Function so crawlers get per-pool Open Graph tags. Firebase Hosting
    # does this via a rewrite in firebase.json; nginx needs an explicit proxy.
    #
    # Uses a VARIABLE proxy_pass + resolver on purpose: the hostname resolves at
    # request time (Docker's embedded DNS at 127.0.0.11), so a DNS/upstream issue
    # can only 502 this one route — it can never stop nginx from starting and take
    # the whole static site down (which a static proxy_pass resolved at boot would).
    # $request_uri is the full original path (/join/<id>), giving the function
    # req.path = /join/<id> to extract the pool id from.
    location /join/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $join_fn "us-central1-gridiron-gamble-uzuqo.cloudfunctions.net";
        proxy_pass https://$join_fn/joinPreview$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $join_fn;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Disable caching for index.html so browsers always fetch the latest bundle hashes
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
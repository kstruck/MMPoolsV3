name: Security Scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run NPM Audit
        run: npm audit --audit-level=high

      # functions/ IS THE DEPLOYED TREE and has its own lockfile, so a
      # root-only audit says nothing about it. That is not hypothetical: a
      # vulnerable brace-expansion sat in functions/ through #236 while this job
      # ran green, because #236 pinned it at the root only. #240 fixed the
      # dependency; this closes the hole that let it hide.
      - name: Install Dependencies (functions)
        working-directory: functions
        run: npm ci

      - name: Run NPM Audit (functions)
        working-directory: functions
        run: npm audit --audit-level=high

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          if [ -f skills/skill-security-scanner/requirements.txt ]; then
            pip install -r skills/skill-security-scanner/requirements.txt
          fi

      - name: Run Dependency Scanner
        run: python skills/skill-security-scanner/scripts/scanner.py --path .

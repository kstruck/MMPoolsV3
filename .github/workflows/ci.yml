name: CI

# Gate on every PR and on pushes to the main branch.
# Blocks merges that fail to build, fail typecheck, or break the scoring tests.
on:
  pull_request:
  push:
    branches: [main, master]

# Least-privilege token: CI only needs to read the repo contents.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — tests/docs-state-invariants.test.ts resolves every
      # deploy-state SHA the operator docs claim against real commit objects.
      # A shallow clone has none of them, and that check fails loudly rather
      # than skipping, so this is load-bearing rather than incidental.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: npm ci
        working-directory: functions

      # REQUIRED: frontend typecheck + production build + per-route prerender
      - name: Build (tsc -b + vite + prerender)
        run: npm run build:static

      # REQUIRED: Cloud Functions typecheck. Use the npm script (not bare tsc)
      # so it first mirrors repo-root shared/ into src/shared/ — that dir is
      # generated (gitignored), so a bare `tsc --noEmit` can't resolve it.
      - name: Typecheck functions
        run: npm run typecheck
        working-directory: functions

      # REQUIRED: full test suite (scoring engines, billing/checkout, onboarding).
      - name: Test
        run: npm test

      # REQUIRED: Cloud Functions unit tests (billing/coupon/referral) — these
      # were previously never run anywhere. vitest resolves from the root install.
      - name: Test functions
        run: npm test
        working-directory: functions

  # REQUIRED: the emulator suite — including the 45-fixture NFL scenario matrix
  # (fixtureMatrix.emulator.test.ts), the best eval in the repo, which until now
  # ran only on a developer's machine. Separate job, not a step in build-and-test,
  # because it needs a JDK for the Firestore emulator.
  #
  # Empty-pass protection is inside the test itself: fixtureMatrix asserts
  # FIXTURES.length >= 40 at describe-collection time, so a broken fixture glob
  # fails the job instead of reporting zero tests as green.
  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node 22 to match functions/package.json engines — this job is the only
      # place the emulator (and therefore the deployed runtime's semantics) is
      # exercised, so it runs on the declared runtime, not the repo-wide 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Root install provides vitest AND the firebase-tools binary that
      # `emulators:exec` runs. npm puts every ancestor node_modules/.bin on PATH,
      # so the functions-dir script finds it without a global install.
      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: npm ci
        working-directory: functions

      - name: Emulator tests (incl. 45-fixture NFL matrix)
        run: npm run test:emulator
        working-directory: functions

  # Validate the nginx config used by the Docker/Coolify production deploy.
  # A syntax error here would fail the container start, so gate it on every PR.
  nginx-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t
        run: docker run --rm -v "${{ github.workspace }}/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t

  # Advisory only — surfaces the ~540 lint findings (mostly no-explicit-any)
  # without blocking merges. Promote to a required check as the debt is paid down.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

name: Loop - stale PR pruner

# Loop 2 of docs/plans/PLAN-LOOPS.md, run through the Claude Agent SDK
# (scripts/agent/run-loop.mjs) so it is paid by the Claude plan's API credit.
#
# 🛑 THIS REPOSITORY IS PUBLIC, AND THIS WORKFLOW HOLDS AN API KEY. Three things
# keep the key away from anyone who is not the owner. Do not relax any of them.
#
#   1. The triggers are `schedule` and `workflow_dispatch` ONLY. Both run the
#      workflow file from the default branch, and only someone with write access
#      can dispatch. NEVER add `pull_request`, `pull_request_target`, `issues`
#      or `issue_comment`: those let a stranger's pull request or comment start
#      a job that holds the key.
#   2. The model has no shell and no file tool (run-loop.mjs, `tools: []`). It
#      cannot read the environment, so it cannot print the key.
#   3. The model never receives a pull request's title, body or comment text.
#      Its tools return numbers, dates and booleans.
#
# `tests/agent-loop-runner.test.ts` fails if a trigger is added or a permission
# is widened.

on:
  schedule:
    # 09:17 UTC every day (02:17 or 03:17 in Arizona/Mountain). Off the hour on
    # purpose: GitHub delays jobs queued at :00.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run changes nothing on GitHub. live warns and closes.'
        type: choice
        options:
          - dry-run
          - live
        default: dry-run

# No permission by default. Each job states the least it needs.
permissions: {}

concurrency:
  group: loop-pr-pruner
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # The issue that holds one comment per run, scheduled or manual
  # (scripts/agent/post-loop-row.mjs; docs/plans/PLAN-LOOPS.md, rule 5).
  LOOP_LOG_ISSUE: "806"

jobs:
  prune:
    name: prune
    # THE SWITCH. A scheduled run happens only while the repository variable
    # MMP_LOOP_PR_PRUNER is exactly `on` (Settings > Secrets and variables >
    # Actions > Variables). Delete it or change it to stop the loop. A manual
    # run ignores the switch, because a person started it.
    if: github.event_name == 'workflow_dispatch' || vars.MMP_LOOP_PR_PRUNER == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/agent/package-lock.json

      - name: Install the Agent SDK (scripts/agent)
        working-directory: scripts/agent
        run: npm ci

      # A scheduled run is LIVE. A manual run is whatever the person chose, and
      # the choice defaults to dry-run.
      #
      # The step exits non-zero for every verdict except CLEAN, so a FINDING,
      # an INCONCLUSIVE or an ERROR turns the run red and GitHub mails the
      # owner. The row is written before the exit, and the next step uploads it
      # either way.
      - name: Run the loop
        env:
          MMP_AGENT_API_KEY: ${{ secrets.MMP_AGENT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOOP_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
        run: node scripts/agent/run-loop.mjs pr-pruner --mode "$LOOP_MODE" --repo "$GITHUB_REPOSITORY" --row-file "$RUNNER_TEMP/loop-row.tsv"

      - name: Keep the row for the log job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-row
          path: ${{ runner.temp }}/loop-row.tsv
          if-no-files-found: ignore
          retention-days: 7

  # Plain code, no model, and a different token: it can comment on issues and
  # cannot touch a pull request. It runs even when `prune` failed, and posts an
  # ERROR row when `prune` left none, so a run is never missing from the log.
  log:
    name: log
    needs: prune
    if: always() && needs.prune.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the row
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: loop-row
          path: ${{ runner.temp }}/row

      # No `npm ci`: post-loop-row.mjs imports nothing outside Node itself.
      - name: Post the row to the loop-log issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/agent/post-loop-row.mjs
          --loop pr-pruner
          --issue "$LOOP_LOG_ISSUE"
          --repo "$GITHUB_REPOSITORY"
          --row-file "$RUNNER_TEMP/row/loop-row.tsv"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
